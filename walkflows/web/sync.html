<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WalkFlows 时间对齐</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><div><span class="eyebrow">WALKFLOWS · 时间配置</span><h1 id="title">多路视频时间对齐</h1><p>以同一可辨认事件为依据，检查并调整各路视频开始时间。</p></div><a href="/" class="tag">平面标定</a></header>
<section class="notice">偏移表示该视频首帧在共同时间轴上的秒数。这里不自动推断时间差；元数据和浏览器播放只能辅助检查，不代表逐帧同步已经验证。</section>
<section class="controls"><button id="play" disabled>播放</button><label for="seek">共同时间</label><input id="seek" type="range" step=".01" disabled><output id="clock">—</output><button id="export" disabled>下载偏移 JSON</button></section>
<p id="status" class="hint">正在读取视频……</p><section id="cameras" class="grid"></section><p id="error" class="error" role="alert"></p><p class="hint">下载后使用 project-apply-offsets 将偏移写入新的项目配置；关闭页面前请先下载。</p></main><script src="/playback.js"></script><script src="/sync.js"></script></body></html>
