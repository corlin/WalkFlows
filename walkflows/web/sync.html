<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WalkFlows 时间对齐</title><link rel="stylesheet" href="/style.css"></head>
<body class="setup-page"><main><header class="page-header"><div><span class="eyebrow">WALKFLOWS · 时间配置</span><h1 id="title">多路视频时间对齐</h1><p>以同一可辨认事件为依据，检查并调整各路视频开始时间。</p></div><span class="tag">配置中</span></header><nav class="page-nav" aria-label="项目功能"><a id="review-link" href="/" hidden>结果复核</a><a href="/sync" aria-current="page">时间配置</a><a href="/calibrate">平面标定</a></nav>
<p id="review-warning" class="notice" hidden>这里修改的配置不会改变已有结果。请下载偏移并重新处理，才能在结果中生效。</p><section class="notice">偏移表示该视频首帧在共同时间轴上的秒数。这里不自动推断时间差；元数据和浏览器播放只能辅助检查，不代表逐帧同步已经验证。</section>
<section class="controls"><button id="play" disabled>播放</button><label for="seek">共同时间</label><input id="seek" type="range" step=".01" disabled><output id="clock">—</output><button id="export" disabled>下载偏移 JSON</button></section>
<p id="status" class="hint">正在读取视频……</p><div class="section-heading"><div><span class="section-kicker">逐路检查</span><h2>摄像头画面</h2></div><p>找到同一事件，调整各路偏移。</p></div><section id="cameras" class="grid"></section><p id="error" class="error" role="alert"></p><p class="hint">完成调整后下载偏移文件。使用统一入口时，在终端按提示输入下载路径；分步操作可使用 project-apply-offsets。关闭页面前请先下载。</p></main><script src="/playback.js"></script><script src="/sync.js"></script></body></html>
