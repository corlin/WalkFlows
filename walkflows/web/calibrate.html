<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WalkFlows 平面标定</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><div><span class="eyebrow">WALKFLOWS · 本地标定</span><h1>建立平面对应点</h1><p>选择地面上清晰、固定的点，为每路视频记录其图像坐标和统一场地坐标。</p></div><a href="/sync" class="tag">时间对齐预览</a></header>
<section class="notice">每路至少选择四个不共线地面点；所有相机必须使用同一坐标原点、方向和单位。建议额外保留未参与拟合的点用于检查精度。</section>
<section class="controls"><label for="camera">相机</label><select id="camera" disabled></select><label for="time">视频时间</label><input id="time" disabled type="range" min="0" step=".05" value="0"><output id="time-label">0.00 秒</output></section>
<section class="calibration-layout"><div><div class="cal-stage"><video id="video" preload="metadata" muted playsinline></video><canvas id="click-image" aria-label="选择视频画面中的地面点"></canvas></div><p class="hint" id="image-point">在画面中选择一个地面点。</p><p class="hint" id="source-warning"></p><p class="error" id="video-error" role="alert"></p></div>
<div class="cal-panel"><h2>添加对应点</h2><p class="hint">先点击画面，再填写该点的实际地面坐标。</p><div class="cal-inputs"><label>平面 X <input id="world-x" type="number" step="any"></label><label>平面 Y <input id="world-y" type="number" step="any"></label></div><button id="add" disabled>添加点</button><button id="undo" disabled>撤销最后一点</button><p id="feedback" role="status"></p><h3>当前相机的点</h3><ol id="points"></ol><button id="download" disabled>下载对应点 JSON</button><p class="hint">下载后使用 project-calibrate 计算映射；下载前切换相机会保留当前页面中的点，关闭页面后不会保留。</p></div></section></main><script src="/calibrate.js"></script></body></html>
