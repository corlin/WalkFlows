[project]
name = "walkflows"
version = "0.1.0"
description = "Offline multi-camera journey analysis research"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "lap==0.5.12",
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "ultralytics==8.3.162",
]

[project.optional-dependencies]
preview = ["imageio-ffmpeg==0.6.0"]

[tool.uv]
package = false
